# One table per implementation column. `cmd` runs with {input} = PNG path and {output} = where to
# write a PAM (see impls/CONTRACT.md). Placeholders: {python} = this project's interpreter,
# {head} = the directory holding upstream HEAD builds (run.py --head). Repo-relative program
# paths are resolved against the repo root. A column whose program is missing is skipped.
#
# project   groups the variants of one implementation (release, HEAD, branches)
# variant   "release" (a published version) or "HEAD" (a development revision)
# lineage   the code base a column's PNG decoding comes from
# memcheck  run under valgrind memcheck in the memory pass (native code only)

[reference-2]
project = "reference"
variant = "lens 2"
lineage = "this project"
notes = "pnglens.py --lens 2: this project's reference decoder read through lens 2; rejects what the lens says to reject, else writes the preferred interpretation."
cmd = ["{python}", "pnglens.py", "--lens", "2", "{input}", "{output}"]
version = ["{python}", "refpng.py", "--version"]
timeout_s = 120

[reference-3]
project = "reference"
variant = "lens 3"
lineage = "this project"
notes = "pnglens.py --lens 3: this project's reference decoder read through lens 3; rejects what the lens says to reject, else writes the preferred interpretation."
cmd = ["{python}", "pnglens.py", "--lens", "3", "{input}", "{output}"]
version = ["{python}", "refpng.py", "--version"]
timeout_s = 120

[libpng]
project = "libpng"
variant = "release"
lineage = "libpng"
notes = "libpng low-level API, png_set_expand only, defaults otherwise; rows read one at a time with png_read_row, interlace passes placed by the shim"
cmd = ["impls/libpng/shim", "{input}", "{output}"]
version = ["impls/libpng/shim", "--version"]
build = ["make", "-s", "-C", "impls/libpng"]
memcheck = true

[stb_image]
project = "stb_image"
variant = "release"
lineage = "stb"
notes = "single-header, ignores CRCs, de-iPhones CgBI"
cmd = ["impls/stb/shim", "{input}", "{output}"]
version = ["impls/stb/shim", "--version"]
build = ["make", "-s", "-C", "impls/stb"]
memcheck = true

[rust-png]
project = "rust-png"
variant = "release"
lineage = "image-rs"
notes = "png crate, Transformations::EXPAND, default limits; rows read one at a time with next_interlaced_row."
cmd = ["impls/rust-png/target/release/rust-png-shim", "{input}", "{output}"]
version = ["cargo", "pkgid", "--manifest-path", "impls/rust-png/Cargo.toml", "png"]
build = ["cargo", "build", "--release", "--quiet", "--manifest-path", "impls/rust-png/Cargo.toml"]
memcheck = true

[ffmpeg]
project = "ffmpeg"
variant = "release"
lineage = "ffmpeg"
notes = "ffmpeg's own pngdec via the CLI, first frame, PAM muxer. Output pinned to rgba|rgba64be: left to itself the CLI negotiates pal8-with-alpha to rgb24 and drops the alpha, and swscale's 8->16 is not x*257, so neither auto nor forced-16 is faithful."
cmd = ["ffmpeg", "-nostdin", "-hide_banner", "-v", "warning", "-i", "{input}", "-vf", "format=rgba|rgba64be", "-frames:v", "1", "-update", "1", "-f", "image2", "-c:v", "pam", "-y", "{output}"]
version = ["ffmpeg", "-version"]
mem_mb = 4096
memcheck = true

[imagemagick]
project = "imagemagick"
variant = "release"
lineage = "libpng"
notes = "ImageMagick PNG coder on top of libpng; first frame. -depth 16 because IM tags palette images with the index bit depth and its PAM writer quantizes samples to that depth."
cmd = ["magick", "{input}[0]", "-depth", "16", "pam:{output}"]
version = ["magick", "-version"]
mem_mb = 4096
memcheck = true

[pngcheck]
project = "pngcheck"
variant = "release"
lineage = "pngcheck"
notes = "structural validator, verdict only"
pixels = false
cmd = ["pngcheck", "-v", "{input}"]
version = ["pngcheck", "-h"]
memcheck = true

[lodepng]
project = "lodepng"
variant = "release"
lineage = "lodepng"
notes = "single-file C/C++ decoder; RGBA at source depth; CRC and Adler-32 checks on by default"
cmd = ["impls/lodepng/shim", "{input}", "{output}"]
version = ["impls/lodepng/shim", "--version"]
build = ["make", "-s", "-C", "impls/lodepng"]
memcheck = true

[libspng]
project = "libspng"
variant = "release"
lineage = "libspng"
notes = "system libspng; SPNG_FMT_RGBA8/16 with SPNG_DECODE_TRNS, progressive: one row at a time with spng_decode_row"
cmd = ["impls/spng/shim", "{input}", "{output}"]
version = ["impls/spng/shim", "--version"]
build = ["make", "-s", "-C", "impls/spng"]
memcheck = true

[wuffs]
project = "wuffs"
variant = "release"
lineage = "wuffs"
notes = "wuffs_aux::DecodeImage with default quirks and limits; non-premultiplied RGBA at source depth"
cmd = ["impls/wuffs/shim", "{input}", "{output}"]
version = ["impls/wuffs/shim", "--version"]
build = ["make", "-s", "-C", "impls/wuffs"]
memcheck = true

[zune-png]
project = "zune-png"
variant = "release"
lineage = "zune"
notes = "zune-png crate, default DecoderOptions"
cmd = ["impls/zune-png/target/release/zune-png-shim", "{input}", "{output}"]
version = ["cargo", "pkgid", "--manifest-path", "impls/zune-png/Cargo.toml", "zune-png"]
build = ["cargo", "build", "--release", "--quiet", "--manifest-path", "impls/zune-png/Cargo.toml"]
memcheck = true

[go-png]
project = "go-png"
variant = "release"
lineage = "go"
notes = "Go standard library image/png; the returned image type is written in its native layout"
cmd = ["impls/go-png/shim", "{input}", "{output}"]
version = ["impls/go-png/shim", "--version"]
build = ["impls/go-png/build.sh", "build", "-o", "shim", "."]

[java-imageio]
project = "java-imageio"
variant = "release"
lineage = "java"
notes = "OpenJDK ImageIO PNG reader; raster written in native band order and sample size"
cmd = ["java", "-Xmx1g", "-Xss512k", "-XX:+UseSerialGC", "-XX:MaxMetaspaceSize=128m", "-XX:ReservedCodeCacheSize=32m", "-XX:CompressedClassSpaceSize=64m", "-XX:TieredStopAtLevel=1", "-cp", "impls/java", "ImageIOShim", "{input}", "{output}"]
version = ["java", "-cp", "impls/java", "ImageIOShim", "--version"]
creates = "impls/java/ImageIOShim.class"
build = ["javac", "-d", "impls/java", "impls/java/ImageIOShim.java"]
mem_mb = 4096
timeout_s = 60

[imagesharp]
project = "imagesharp"
variant = "release"
lineage = "imagesharp"
notes = "SixLabors.ImageSharp on .NET; Rgba32 or Rgba64 chosen from the IHDR depth"
cmd = ["impls/imagesharp/bin/publish/ImageSharpShim", "{input}", "{output}"]
version = ["impls/imagesharp/bin/publish/ImageSharpShim", "--version"]
build = ["dotnet", "publish", "impls/imagesharp", "-c", "Release", "-o", "impls/imagesharp/bin/publish", "-v", "q", "--nologo"]
# EnableWriteXorExecute=0: the runtime's W^X double mapping ftruncates a 2 GiB memfd, which trips RLIMIT_FSIZE.
env = { DOTNET_GCHeapHardLimit = "0x40000000", DOTNET_TieredPGO = "0", DOTNET_EnableWriteXorExecute = "0", DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1" }
mem_mb = 8192
timeout_s = 60

[fast-png]
project = "fast-png"
variant = "release"
lineage = "fast-png"
notes = "image-js fast-png (JavaScript). fast-png returns grayscale/RGB tRNS to the caller instead of applying it; the shim applies it as a conforming caller would (masked to the bit depth), so tRNS results for those color types measure the shim's use of the interface."
cmd = ["node", "impls/node/fast-png.mjs", "{input}", "{output}"]
version = ["node", "impls/node/fast-png.mjs", "--version"]
creates = "impls/node/node_modules"
build = ["npm", "ci", "--silent", "--prefix", "impls/node"]

[pngjs]
project = "pngjs"
variant = "release"
lineage = "pngjs"
notes = "pngjs sync API with skipRescale; always RGBA"
cmd = ["node", "impls/node/pngjs.mjs", "{input}", "{output}"]
version = ["node", "impls/node/pngjs.mjs", "--version"]
creates = "impls/node/node_modules"
build = ["npm", "ci", "--silent", "--prefix", "impls/node"]

[upng]
project = "upng"
variant = "release"
lineage = "upng"
notes = "UPNG.js decode + toRGBA8, first frame; 8-bit only"
cmd = ["node", "impls/node/upng.mjs", "{input}", "{output}"]
version = ["node", "impls/node/upng.mjs", "--version"]
creates = "impls/node/node_modules"
build = ["npm", "ci", "--silent", "--prefix", "impls/node"]
max_depth = 8

[pillow]
project = "pillow"
variant = "release"
lineage = "pillow"
notes = "Pillow's own PNG plugin (zlib, not libpng); convert('RGBA') for modes up to 8 bits, 16-bit gray kept; Pillow reads 16-bit RGB(A) as 8-bit"
cmd = ["{python}", "impls/pillow_shim.py", "{input}", "{output}"]
version = ["{python}", "impls/pillow_shim.py", "--version"]
max_depth = 8

[pypng]
project = "pypng"
variant = "release"
lineage = "pypng"
notes = "pure-Python pypng Reader.asRGBA(); honors sBIT by rescaling"
cmd = ["{python}", "impls/pypng_shim.py", "{input}", "{output}"]
version = ["{python}", "impls/pypng_shim.py", "--version"]
timeout_s = 120

[opencv]
project = "opencv"
variant = "release"
lineage = "libpng"
notes = "OpenCV imread IMREAD_UNCHANGED over its bundled libpng (uv sync --extra opencv). Thread pools capped: with 32 threads of OpenBLAS/OpenMP buffers it segfaults under a 4 GiB address-space limit."
cmd = ["{python}", "impls/opencv_shim.py", "{input}", "{output}"]
version = ["{python}", "impls/opencv_shim.py", "--version"]
env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", OPENCV_FOR_THREADS_NUM = "1" }
mem_mb = 8192

[chunky_png]
project = "chunky_png"
variant = "release"
lineage = "chunky_png"
notes = "pure-Ruby ChunkyPNG; 8-bit RGBA only"
cmd = ["ruby", "impls/ruby/chunky_png_shim.rb", "{input}", "{output}"]
version = ["ruby", "impls/ruby/chunky_png_shim.rb", "--version"]
max_depth = 8
timeout_s = 120

[pngtopam]
project = "pngtopam"
variant = "release"
lineage = "libpng"
notes = "netpbm pngtopam -alphapam: libpng with netpbm's policies"
cmd = ["sh", "-c", "exec pngtopam -alphapam \"$1\" > \"$2\"", "pngtopam", "{input}", "{output}"]
version = ["pngtopam", "--version"]
memcheck = true

[graphicsmagick]
project = "graphicsmagick"
variant = "release"
lineage = "libpng"
notes = "GraphicsMagick PNG coder over libpng; -depth 16 for the same reason as ImageMagick"
cmd = ["gm", "convert", "{input}[0]", "-depth", "16", "pam:{output}"]
version = ["gm", "version"]
mem_mb = 4096
memcheck = true

# HEAD columns: each upstream's development revision, built from the clones under {head}.
# Every `build` runs from the repo root and writes only under {head}/difftest/<column>/.
# Builds that fetch from the network: cargo, uv, dotnet, and imagesharp-head's SharedInfrastructure submodule.

[libpng16-head]
project = "libpng"
variant = "HEAD"
revision = "8c2a5fb 2026-10-21"
lineage = "libpng"
notes = "libpng low-level API, png_set_expand only, defaults otherwise; rows read one at a time with png_read_row, interlace passes placed by the shim. libpng16 branch (1.6.60.git), built static with the clone's CMake (defaults, hardware optimizations on) and linked into the shim."
cmd = ["{head}/difftest/libpng16-head/shim", "{input}", "{output}"]
version = ["{head}/difftest/libpng16-head/shim", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/libpng16-head
rm -rf $d/build
cmake -S {head}/ctools/libpng16 -B $d/build -DCMAKE_BUILD_TYPE=Release -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_EXECUTABLES=OFF > /dev/null
cmake --build $d/build -j > /dev/null
cc -O2 -Wall -Wextra -I{head}/ctools/libpng16 -I$d/build -o $d/shim impls/libpng/shim.c $d/build/libpng16.a -lz -lm
''']
memcheck = true

[libpng18-head]
project = "libpng"
variant = "HEAD"
revision = "682e5fe 2026-10-21"
lineage = "libpng"
notes = "libpng low-level API, png_set_expand only, defaults otherwise; rows read one at a time with png_read_row, interlace passes placed by the shim. libpng18 branch (1.8.0.git, the repository's default branch), built static with the clone's CMake (defaults, hardware optimizations on) and linked into the shim."
cmd = ["{head}/difftest/libpng18-head/shim", "{input}", "{output}"]
version = ["{head}/difftest/libpng18-head/shim", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/libpng18-head
rm -rf $d/build
cmake -S {head}/ctools/libpng -B $d/build -DCMAKE_BUILD_TYPE=Release -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_EXECUTABLES=OFF > /dev/null
cmake --build $d/build -j > /dev/null
cc -O2 -Wall -Wextra -I{head}/ctools/libpng -I$d/build -o $d/shim impls/libpng/shim.c $d/build/libpng18.a -lz -lm
''']
memcheck = true

[stb_image-head]
project = "stb_image"
variant = "HEAD"
revision = "a7d4c21 2026-10-19"
lineage = "stb"
notes = "single-header, ignores CRCs, de-iPhones CgBI. stb_image.h at this revision is byte-identical to the vendored impls/stb/stb_image.h (v2.30). The shim source is copied into the column directory so its quoted #include \"stb_image.h\" resolves through -I to the clone's header, not the vendored copy beside impls/stb/shim.c."
cmd = ["{head}/difftest/stb_image-head/shim", "{input}", "{output}"]
version = ["{head}/difftest/stb_image-head/shim", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/stb_image-head
mkdir -p $d
cp impls/stb/shim.c $d/shim.c
v=$(grep -m1 -oE 'stb_image - v[0-9.]+' {head}/clibs/stb/stb_image.h | sed 's/stb_image - //')
cc -O2 -Wall -Wextra -Wno-unused-function -I{head}/clibs/stb -DSTB_VER="\"$v\"" -o $d/shim $d/shim.c -lm
''']
memcheck = true

[rust-png-head]
project = "rust-png"
variant = "HEAD"
revision = "b2f10c6 2026-09-23"
lineage = "image-rs"
notes = "png crate, Transformations::EXPAND, default limits; rows read one at a time with next_interlaced_row. The shim crate patches crates.io png 0.18.1 with the master clone (path dependency); other dependencies from crates.io."
cmd = ["{head}/difftest/rust-png-head/target/release/rust-png-shim", "{input}", "{output}"]
version = ["cargo", "pkgid", "--manifest-path", "{head}/difftest/rust-png-head/Cargo.toml", "png"]
build = ["sh", "-ec", '''
d={head}/difftest/rust-png-head
mkdir -p $d/src
cp impls/rust-png/src/main.rs $d/src/main.rs
[ -f $d/Cargo.lock ] || cp impls/rust-png/Cargo.lock $d/Cargo.lock
printf '[package]\nname = "rust-png-shim"\nversion = "0.1.0"\nedition = "2024"\n\n[dependencies]\npng = "0.18.1"\n\n[patch.crates-io.png]\npath = "%s"\n' {head}/src/image-png > $d/Cargo.toml
cargo build --release --quiet --manifest-path $d/Cargo.toml
''']
memcheck = true

[ffmpeg-head]
project = "ffmpeg"
variant = "HEAD"
revision = "179d083 2026-10-22"
lineage = "ffmpeg"
notes = "ffmpeg's own pngdec via the CLI, first frame, PAM muxer. Output pinned to rgba|rgba64be: left to itself the CLI negotiates pal8-with-alpha to rgb24 and drops the alpha, and swscale's 8->16 is not x*257, so neither auto nor forced-16 is faithful. Built in-tree in {head}/ffmpeg (static, --disable-everything plus the png/apng decoders, image2/apng/png_pipe demuxers, png parser, file protocol, image2 muxer, pam encoder, format/scale/null filters); no build step here because ffmpeg only builds in its own tree."
cmd = ["{head}/ffmpeg/ffmpeg", "-nostdin", "-hide_banner", "-v", "warning", "-i", "{input}", "-vf", "format=rgba|rgba64be", "-frames:v", "1", "-update", "1", "-f", "image2", "-c:v", "pam", "-y", "{output}"]
version = ["{head}/ffmpeg/ffmpeg", "-version"]
mem_mb = 4096
memcheck = true

[imagemagick-head]
project = "imagemagick"
variant = "HEAD"
revision = "a0ac982 2026-10-22"
lineage = "libpng"
notes = "ImageMagick PNG coder on top of libpng; first frame. -depth 16 because IM tags palette images with the index bit depth and its PAM writer quantizes samples to that depth. 7.1.2-35 beta, Q16 HDRI, static, PNG-only configure, over the system libpng; a0ac982 needs the missing ';' in MagickCore/draw.c restored to compile (the build does that)."
cmd = ["{head}/difftest/imagemagick-head/inst/bin/magick", "{input}[0]", "-depth", "16", "pam:{output}"]
version = ["{head}/difftest/imagemagick-head/inst/bin/magick", "-version"]
build = ["sh", "-ec", '''
d={head}/difftest/imagemagick-head
rm -rf $d/src $d/inst
mkdir -p $d/src
git -C {head}/ctools/imagemagick archive HEAD | tar -x -C $d/src
sed -i 's/^    return(MagickTrue)$/    return(MagickTrue);/' $d/src/MagickCore/draw.c
cd $d/src
./configure -q --prefix=$d/inst --disable-shared --enable-static --without-magick-plus-plus --without-perl --without-x --disable-openmp --disable-docs --without-modules --with-png=yes --without-jpeg --without-tiff --without-webp --without-heic --without-jxl --without-raw --without-openexr --without-fontconfig --without-freetype --without-lcms --without-xml --without-lqr --without-djvu --without-openjp2 --without-zstd --without-lzma --without-bzlib --without-raqm --without-pango --without-rsvg --without-wmf --without-gvc --without-fftw --without-jbig --without-dps --without-fpx --without-uhdr
make -s -j"$(nproc)"
make -s install
''']
mem_mb = 4096
memcheck = true

[graphicsmagick-head]
project = "graphicsmagick"
variant = "HEAD"
revision = "hg 18216:0ca2165aa07c 2026-10-21"
lineage = "libpng"
notes = "GraphicsMagick PNG coder over libpng; -depth 16 for the same reason as ImageMagick. Mercurial tip, Q16, static, PNG-only configure, over the system libpng."
cmd = ["{head}/difftest/graphicsmagick-head/inst/bin/gm", "convert", "{input}[0]", "-depth", "16", "pam:{output}"]
version = ["{head}/difftest/graphicsmagick-head/inst/bin/gm", "version"]
build = ["sh", "-ec", '''
d={head}/difftest/graphicsmagick-head
rm -rf $d/src $d/inst
mkdir -p $d
hg archive -R {head}/ctools/gm -r . -t files $d/src
cd $d/src
./configure -q --prefix=$d/inst --disable-shared --enable-static --without-magick-plus-plus --without-perl --without-x --disable-openmp --without-modules --with-png --without-jpeg --without-tiff --without-webp --without-jxl --without-lcms2 --without-xml --without-zstd --without-lzma --without-bzlib --without-wmf --without-jbig --without-dps --without-fpx --without-ttf --without-trio --without-jp2 --without-heif --with-quantum-depth=16
make -s -j"$(nproc)"
make -s install
''']
