[upng-head]
creates = "{head}/difftest/upng-head/upng.mjs"
project = "upng"
variant = "HEAD"
revision = "88f504b 2023-07-22"
lineage = "upng"
notes = "UPNG.js decode + toRGBA8, first frame; 8-bit only. master (2.2.0) is a browser script with no exports: node_modules/upng-js/index.cjs runs the clone's UPNG.js in a vm context and exports UPNG; --version reports 2.2.0 (release column: npm 2.1.0)."
cmd = ["node", "{head}/difftest/upng-head/upng.mjs", "{input}", "{output}"]
version = ["node", "{head}/difftest/upng-head/upng.mjs", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/upng-head
rm -rf $d
mkdir -p $d/node_modules/upng-js
cp impls/node/upng.mjs $d/
sed 's#"main": "UPNG"#"main": "index.cjs"#' {head}/scripting/UPNG.js/package.json > $d/node_modules/upng-js/package.json
grep -q index.cjs $d/node_modules/upng-js/package.json
cat > $d/node_modules/upng-js/index.cjs <<'EOF'
// Runs the master UPNG.js (a browser script with no module export) in a vm context.
const fs = require('fs');
const path = require('path');
const vm = require('vm');
const src = fs.readFileSync(path.join(__dirname, '../../../../scripting/UPNG.js/UPNG.js'), 'utf8');
const ctx = vm.createContext(new Object());
ctx.window = new Object();
for (const k of ['console', 'Uint8Array', 'Uint16Array', 'Uint32Array', 'Int32Array', 'Float32Array', 'Float64Array', 'ArrayBuffer', 'DataView', 'Math', 'Date', 'Array', 'String', 'Error', 'TypeError']) ctx[k] = globalThis[k];
vm.runInContext(src + '\n;this.UPNG = UPNG;', ctx);
module.exports = ctx.UPNG;
EOF
''']
max_depth = 8
memcheck = false

