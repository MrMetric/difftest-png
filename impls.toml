[opencv-head]
project = "opencv"
variant = "HEAD"
revision = "ce58bb1 2026-10-22"
lineage = "libpng"
notes = "OpenCV imread IMREAD_UNCHANGED over its bundled libpng. Thread pools capped: with 32 threads of OpenBLAS/OpenMP buffers it segfaults under a 4 GiB address-space limit. Branch 5.x (the default) built static with core,imgproc,imgcodecs and the python3 bindings, bundled libpng (1.6.57 at this revision) and zlib, everything else off (harfbuzz and freetype too, which would otherwise pull the system libpng into the process); the 4.x branch is not built."
cmd = ["{head}/difftest/opencv-head/venv/bin/python", "impls/opencv_shim.py", "{input}", "{output}"]
version = ["{head}/difftest/opencv-head/venv/bin/python", "impls/opencv_shim.py", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/opencv-head
# the bindings generator is Python run from the source tree: keep it from writing __pycache__ there
export PYTHONDONTWRITEBYTECODE=1
rm -rf $d/build $d/inst
mkdir -p $d
uv venv -q --allow-existing --python 3.13 $d/venv
uv pip install -q --python $d/venv/bin/python numpy
py=$d/venv/bin/python
cmake -S {head}/clibs/opencv -B $d/build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$d/inst -DOPENCV_DOWNLOAD_PATH=$d/download -DENABLE_CCACHE=OFF -DBUILD_LIST=core,imgproc,imgcodecs,python3,python_bindings_generator -DBUILD_SHARED_LIBS=OFF -DBUILD_PNG=ON -DBUILD_ZLIB=ON -DWITH_PNG=ON -DWITH_SPNG=OFF -DWITH_HARFBUZZ=OFF -DWITH_FREETYPE=OFF -DWITH_JPEG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_OPENJPEG=OFF -DWITH_JASPER=OFF -DWITH_OPENEXR=OFF -DWITH_AVIF=OFF -DWITH_JPEGXL=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_OPENCL=OFF -DWITH_LAPACK=OFF -DWITH_EIGEN=OFF -DWITH_OPENMP=OFF -DWITH_TBB=OFF -DWITH_QT=OFF -DWITH_GTK=OFF -DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DWITH_V4L=OFF -DWITH_PROTOBUF=OFF -DWITH_VTK=OFF -DWITH_GDAL=OFF -DWITH_GDCM=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF -DBUILD_opencv_apps=OFF -DBUILD_JAVA=OFF -DPYTHON3_EXECUTABLE=$py -DPYTHON3_LIBRARY=$($py -c 'import sysconfig as s; print(s.get_config_var("LIBDIR") + "/" + s.get_config_var("LDLIBRARY"))') -DPYTHON3_INCLUDE_DIR=$($py -c 'import sysconfig; print(sysconfig.get_paths()["include"])') -DPYTHON3_NUMPY_INCLUDE_DIRS=$($py -c 'import numpy; print(numpy.get_include())') -DOPENCV_PYTHON3_INSTALL_PATH=$d/inst/python
cmake --build $d/build
cmake --install $d/build
''']
env = { PYTHONPATH = "{head}/difftest/opencv-head/inst/python", OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", OPENCV_FOR_THREADS_NUM = "1" }
mem_mb = 8192
memcheck = false

