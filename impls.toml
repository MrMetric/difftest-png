[zune-png-head]
project = "zune-png"
variant = "HEAD"
revision = "33007f6 2026-10-22"
lineage = "zune"
notes = "zune-png crate, default DecoderOptions. Branch dev (the default; main is stale and does not build); zune-png, zune-core and zune-inflate patched to the clone's crates."
