project = "imagesharp"
variant = "HEAD"
revision = "d1367d4 2026-04-07"
lineage = "imagesharp"
notes = "SixLabors.ImageSharp on .NET; Rgba32 or Rgba64 chosen from the IHDR depth. Branch release/3.1.x (v3.1.12-13-gd1367d4) built from source through a ProjectReference, net6.0 library on the .NET 9 runtime; the SharedInfrastructure submodule is cloned at its pinned commit 353b9af. --version says 0.0.1 because the archived tree has no git history for MinVer. main (4.x) is not built: it needs the .NET 10 SDK and a Six Labors license key at build time."
cmd = ["{head}/difftest/imagesharp-head/publish/ImageSharpShim", "{input}", "{output}"]
version = ["{head}/difftest/imagesharp-head/publish/ImageSharpShim", "--version"]
build = ["sh", "-ec", '''
d={head}/difftest/imagesharp-head
rm -rf $d/src $d/shim $d/publish
mkdir -p $d/src $d/shim
git -C {head}/src/ImageSharp-3.1.x archive HEAD | tar -x -C $d/src
git clone -q https://github.com/SixLabors/SharedInfrastructure $d/src/shared-infrastructure
git -C $d/src/shared-infrastructure checkout -q 353b9afe32a8000410312d17263407cd7bb82d19
cp impls/imagesharp/Program.cs $d/shim/
sed -E 's#<PackageReference Include="SixLabors.ImageSharp" Version="[^"]*" />#<ProjectReference Include="../src/src/ImageSharp/ImageSharp.csproj" />#' impls/imagesharp/ImageSharpShim.csproj > $d/shim/ImageSharpShim.csproj
grep -q ProjectReference $d/shim/ImageSharpShim.csproj
DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 dotnet publish $d/shim -c Release -o $d/publish -v q --nologo
